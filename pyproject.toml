[project]
name = "05-splitly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mélina Wang", email = "melina.wang@imt-atlantique.net" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
